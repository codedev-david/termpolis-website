<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Mneme's learning loop: Reflect, Consolidate, Connect, Rank, Anticipate — repeating after every task so the shared memory keeps getting smarter.">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161d"/>
      <stop offset="1" stop-color="#101015"/>
    </linearGradient>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7a7a95"/>
    </marker>
    <marker id="arrLoop" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7ee2a3"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#bgL)" stroke="#2a2a38" stroke-width="1.5"/>

  <text x="40" y="52" fill="#f4f4fa" font-size="28" font-weight="700">The learning loop &#8212; how the memory gets smarter</text>
  <text x="40" y="82" fill="#a6a6bd" font-size="16">Most &#8220;AI memory&#8221; is just a bucket you read and write. Mneme runs this cycle on top of it after every finished task.</text>

  <!-- 5 cards -->
  <!-- card template: x width=200, y=120 h=250 -->
  <g font-size="12">
    <!-- 1 Reflect -->
    <rect x="28" y="120" width="200" height="250" rx="14" fill="#1b1726" stroke="#4a3f7a"/>
    <circle cx="58" cy="152" r="15" fill="#2a2140" stroke="#a78bfa"/><text x="58" y="157" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">1</text>
    <text x="84" y="157" fill="#c4b5fd" font-size="17" font-weight="700">Reflect</text>
    <text x="48" y="196" fill="#d7d7e6">When a task finishes,</text>
    <text x="48" y="215" fill="#d7d7e6">Mneme distills a</text>
    <text x="48" y="234" fill="#d7d7e6">reusable lesson:</text>
    <text x="48" y="256" fill="#a6a6bd">the problem, the fix,</text>
    <text x="48" y="275" fill="#a6a6bd">and the gotcha.</text>
    <text x="48" y="336" fill="#8b8ba3" font-size="11">Only substantive work</text>
    <text x="48" y="352" fill="#8b8ba3" font-size="11">is kept.</text>

    <!-- 2 Consolidate -->
    <rect x="266" y="120" width="200" height="250" rx="14" fill="#12222a" stroke="#1f6b7d"/>
    <circle cx="296" cy="152" r="15" fill="#10262e" stroke="#22d3ee"/><text x="296" y="157" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="700">2</text>
    <text x="322" y="157" fill="#67e8f9" font-size="17" font-weight="700">Consolidate</text>
    <text x="286" y="196" fill="#d7d7e6">While idle &#8212; like</text>
    <text x="286" y="215" fill="#d7d7e6">sleep &#8212; it merges</text>
    <text x="286" y="234" fill="#d7d7e6">duplicates, forgets</text>
    <text x="286" y="253" fill="#d7d7e6">stale chatter, and</text>
    <text x="286" y="272" fill="#d7d7e6">summarizes clusters.</text>
    <text x="286" y="336" fill="#8b8ba3" font-size="11">Important, tagged, or</text>
    <text x="286" y="352" fill="#8b8ba3" font-size="11">linked notes are kept.</text>

    <!-- 3 Connect -->
    <rect x="504" y="120" width="200" height="250" rx="14" fill="#122420" stroke="#2f7d55"/>
    <circle cx="534" cy="152" r="15" fill="#10241b" stroke="#7ee2a3"/><text x="534" y="157" text-anchor="middle" fill="#7ee2a3" font-size="15" font-weight="700">3</text>
    <text x="560" y="157" fill="#7ee2a3" font-size="17" font-weight="700">Connect</text>
    <text x="524" y="196" fill="#d7d7e6">It links memories</text>
    <text x="524" y="215" fill="#d7d7e6">with typed edges &#8212;</text>
    <text x="524" y="234" fill="#d7d7e6">solved-by, caused-by,</text>
    <text x="524" y="253" fill="#d7d7e6">supersedes &#8212; building</text>
    <text x="524" y="272" fill="#d7d7e6">a knowledge graph.</text>
    <text x="524" y="336" fill="#8b8ba3" font-size="11">Superseded answers</text>
    <text x="524" y="352" fill="#8b8ba3" font-size="11">drop out of recall.</text>

    <!-- 4 Rank -->
    <rect x="742" y="120" width="200" height="250" rx="14" fill="#241f12" stroke="#8a6d1f"/>
    <circle cx="772" cy="152" r="15" fill="#241d0f" stroke="#fbbf24"/><text x="772" y="157" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="700">4</text>
    <text x="798" y="157" fill="#fcd34d" font-size="17" font-weight="700">Rank</text>
    <text x="762" y="196" fill="#d7d7e6">Recall scores by</text>
    <text x="762" y="215" fill="#d7d7e6">meaning + recency +</text>
    <text x="762" y="234" fill="#d7d7e6">importance + how</text>
    <text x="762" y="253" fill="#d7d7e6">often a memory has</text>
    <text x="762" y="272" fill="#d7d7e6">actually helped.</text>
    <text x="762" y="336" fill="#8b8ba3" font-size="11">Diverse hits, never</text>
    <text x="762" y="352" fill="#8b8ba3" font-size="11">the same one twice.</text>

    <!-- 5 Anticipate -->
    <rect x="980" y="120" width="200" height="250" rx="14" fill="#241623" stroke="#8a3f6d"/>
    <circle cx="1010" cy="152" r="15" fill="#24101c" stroke="#f472b6"/><text x="1010" y="157" text-anchor="middle" fill="#f9a8d4" font-size="15" font-weight="700">5</text>
    <text x="1036" y="157" fill="#f9a8d4" font-size="17" font-weight="700">Anticipate</text>
    <text x="1000" y="196" fill="#d7d7e6">Before you even start</text>
    <text x="1000" y="215" fill="#d7d7e6">a task, it surfaces</text>
    <text x="1000" y="234" fill="#d7d7e6">the answer the fleet</text>
    <text x="1000" y="253" fill="#d7d7e6">already found for it.</text>
    <text x="1000" y="336" fill="#8b8ba3" font-size="11">Stop re-deriving what</text>
    <text x="1000" y="352" fill="#8b8ba3" font-size="11">you already know.</text>
  </g>

  <!-- forward arrows between cards -->
  <g stroke="#7a7a95" stroke-width="2" fill="none">
    <line x1="230" y1="245" x2="262" y2="245" marker-end="url(#arrL)"/>
    <line x1="468" y1="245" x2="500" y2="245" marker-end="url(#arrL)"/>
    <line x1="706" y1="245" x2="738" y2="245" marker-end="url(#arrL)"/>
    <line x1="944" y1="245" x2="976" y2="245" marker-end="url(#arrL)"/>
  </g>

  <!-- loop-back arrow -->
  <path d="M1080 372 C 1080 452, 128 452, 128 374" fill="none" stroke="#7ee2a3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrLoop)"/>
  <text x="600" y="474" text-anchor="middle" fill="#7ee2a3" font-size="14" font-weight="600">Repeats after every finished task &#8212; forever. The more the fleet works, the smarter the shared brain gets.</text>

  <text x="600" y="522" text-anchor="middle" fill="#6f6f88" font-size="12.5">All of it runs locally and automatically &#8212; nothing to click, nothing sent to a server.</text>
</svg>
